<style>

.container{display:flex;flex-wrap:wrap;justify-content:center;padding:20px;gap:5px}
.card{width:270px;min-height:342px;background:white;border:2px solid gray;line-height:25px;border-radius:10px;text-align:center;overflow:hidden;margin:10px;transition:.3s;box-shadow:3px 10px 20px #6b6a6a}

.card img{width:100%;height:155px;display:block;object-fit:cover}
.details{padding-top:8px}
.heading{font-size:18px;font-weight:700}
.card-btn{width:100%;padding:10px;margin-top:10px;background:#00c8ff;color:#252323;border:none;cursor:pointer;font-weight:600}
.card-btn:hover{background:#0096c8;color:white}
</style>

function displayProducts(list){
 const container=document.getElementById("productContainer");
 container.innerHTML="";
 list.forEach((product,index)=>{
   const card=document.createElement("div");
   card.className="card";
   card.innerHTML=`
     <img src="${product.image}" alt="${product.brand} ${product.product}">
     <div class="details">
       <span class="heading">Brand:</span> ${product.brand}<br>
       <span class="heading">Product:</span> ${product.product}<br>
       <span class="heading">Price:</span> ${product.price}<br>
       <span class="heading">Rating:</span> ${product.rating}<br>
       <button class="card-btn" onclick="addToCart(${index})">ADD TO CART</button>
     </div>`;
   container.appendChild(card);
 });
}

function addToCart(index){
 alert(products[index].brand+" "+products[index].product+" added to cart!");
}

function searchProducts(){
 const value=document.getElementById("searchBox").value.toLowerCase();
 displayProducts(products.filter(p=>p.brand.toLowerCase().includes(value)||p.product.toLowerCase().includes(value)));
}

displayProducts(products);
</script>
